server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://localhost:3306/kids_book_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Mail configuration: set MAIL_USERNAME and MAIL_PASSWORD environment variables for production
  # Default values are placeholders that disable email functionality
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:test@qq.com}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        transport:
          protocol: smtp

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:kidsbook-secret-key-for-development-only-must-be-at-least-32-characters}
  expiration: 604800000

kidsbook:
  upload:
    # Use absolute path in production via UPLOAD_PATH environment variable
    path: ${UPLOAD_PATH:./uploads}
